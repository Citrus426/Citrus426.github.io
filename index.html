<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY CYBER SHOWCASE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #080811;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* 背景 Canvas */
    #canvas-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* 主内容居中 */
    .container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 头部区域 */
    .hero {
      text-align: center;
      margin-bottom: 50px;
    }

    .avatar-wrapper {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin: 0 auto 20px;
      padding: 3px;
      background: linear-gradient(135deg, #00f2fe, #4facfe, #000);
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #ffffff, #8be9fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .typewriter-box {
      font-size: 1.2rem;
      color: #00f2fe;
      min-height: 30px;
      font-family: monospace;
    }

    /* 毛玻璃卡片网格 */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(0, 242, 254, 0.5);
      box-shadow: 0 10px 30px rgba(0, 242, 254, 0.15);
      background: rgba(255, 255, 255, 0.06);
    }

    .card-tag {
      font-size: 0.75rem;
      color: #00f2fe;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .card h3 {
      font-size: 1.2rem;
      margin-bottom: 10px;
      color: #f1f2f6;
    }

    .card p {
      font-size: 0.9rem;
      color: #a4b0be;
      line-height: 1.6;
    }

    /* 底部按钮栏 */
    .links {
      display: flex;
      gap: 15px;
      margin-top: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      text-decoration: none;
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 0.9rem;
      transition: 0.3s;
    }

    .btn:hover {
      background: #00f2fe;
      color: #080811;
      font-weight: bold;
      box-shadow: 0 0 15px #00f2fe;
    }
  </style>
</head>
<body>

  <!-- 背景粒子动画 -->
  <canvas id="canvas-bg"></canvas>

  <div class="container">
    <!-- 头部信息 -->
    <header class="hero">
      <div class="avatar-wrapper">
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=CoolUser" alt="Avatar">
      </div>
      <h1>YOUR NAME</h1>
      <div class="typewriter-box"><span id="typewriter"></span></div>
    </header>

    <!-- 卡片展示区 -->
    <main class="grid">
      <div class="card">
        <div class="card-tag">PROJECT 01</div>
        <h3>数字造物计划</h3>
        <p>探索前端视觉边界，利用 WebGL 与 Canvas 渲染赛博美学交互体验。</p>
      </div>

      <div class="card">
        <div class="card-tag">PROJECT 02</div>
        <h3>代码实验室</h3>
        <p>一些有趣的开源工具、动画实验以及未完成但充满野心的半成品。</p>
      </div>

      <div class="card">
        <div class="card-tag">STATUS</div>
        <h3>当下状态</h3>
        <p>正在探索独立开发、AI 工作流与极简设计。随时欢迎灵感碰撞。</p>
      </div>
    </main>

    <!-- 社交 / 外部链接 -->
    <footer class="links">
      <a href="https://github.com" target="_blank" class="btn">GitHub</a>
      <a href="https://x.com" target="_blank" class="btn">Twitter / X</a>
      <a href="mailto:your-email@example.com" class="btn">Email Me</a>
    </footer>
  </div>

  <script>
    // 1. 打字机特效
    const words = ["Creative Explorer.", "Digital Nomad.", "Building the Future."];
    let i = 0, timer;

    function typingEffect() {
      let word = words[i].split("");
      var loopTyping = function() {
        if (word.length > 0) {
          document.getElementById('typewriter').innerHTML += word.shift();
        } else {
          setTimeout(deletingEffect, 2000);
          return false;
        }
        timer = setTimeout(loopTyping, 100);
      };
      loopTyping();
    }

    function deletingEffect() {
      let word = words[i].split("");
      var loopDeleting = function() {
        if (word.length > 0) {
          word.pop();
          document.getElementById('typewriter').innerHTML = word.join("");
        } else {
          if (words.length > (i + 1)) { i++; } else { i = 0; }
          setTimeout(typingEffect, 500);
          return false;
        }
        timer = setTimeout(loopDeleting, 50);
      };
      loopDeleting();
    }
    typingEffect();

    // 2. 粒子交互背景
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    let width, height, particles;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }

    class Particle {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.vx = (Math.random() - 0.5) * 0.8;
        this.vy = (Math.random() - 0.5) * 0.8;
        this.radius = Math.random() * 1.5 + 0.5;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > width) this.vx = -this.vx;
        if (this.y < 0 || this.y > height) this.vy = -this.vy;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(0, 242, 254, 0.5)";
        ctx.fill();
      }
    }

    function initParticles() {
      particles = [];
      const count = Math.floor(window.innerWidth / 15);
      for (let i = 0; i < count; i++) {
        particles.push(new Particle());
      }
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
        for (let j = i + 1; j < particles.length; j++) {
          const dist = Math.hypot(particles[i].x - particles[j].x, particles[i].y - particles[j].y);
          if (dist < 100) {
            ctx.beginPath();
            ctx.strokeStyle = `rgba(0, 242, 254, ${0.15 * (1 - dist / 100)})`;
            ctx.lineWidth = 0.5;
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => { resize(); initParticles(); });
    resize();
    initParticles();
    animate();
  </script>
</body>
</html>1
