<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a, #1e293b); color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 40px; max-width: 480px; width: 100%; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .avatar { width: 90px; height: 90px; border-radius: 50%; background: #38bdf8; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 36px; }
        h1 { font-size: 24px; margin-bottom: 8px; }
        p.bio { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
        .links { display: flex; flex-direction: column; gap: 12px; }
        .link-btn { display: block; padding: 12px 20px; background: rgba(255, 255, 255, 0.08); color: #f8fafc; text-decoration: none; border-radius: 10px; font-weight: 500; transition: 0.2s; border: 1px solid transparent; }
        .link-btn:hover { background: #38bdf8; color: #0f172a; transform: translateY(-2px); font-weight: 600; }
        .footer { margin-top: 30px; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">🐱</div>
        <h1>你好，我是网站主人 👋</h1>
        <p class="bio">欢迎来到我的个人主页，记录生活与技术。</p>
        <div class="links">
            <a href="https://github.com" target="_blank" class="link-btn">📌 我的 GitHub</a>
            <a href="mailto:your-email@example.com" class="link-btn">📫 发送邮件联系我</a>
            <a href="#" class="link-btn">🎮 正在玩的游戏 / 爱好</a>
        </div>
        <div class="footer">© 2026 maomi.site · 保持热爱</div>
    </div>
</body>
</html>
